schema_version: 1

# Operator probe profiles. runner_label is the label expected on the
# self-hosted Linux runner physically connected to that network.
profiles:
  mci:
    display_name: "MCI"
    network_type: "mobile"
    runner_label: "ase-mci"
    enabled: true
  irancell:
    display_name: "Irancell"
    network_type: "mobile"
    runner_label: "ase-irancell"
    enabled: true
  rightel:
    display_name: "Rightel"
    network_type: "mobile"
    runner_label: "ase-rightel"
    enabled: true
  fixed:
    display_name: "Fixed ISP Probe"
    network_type: "fixed"
    runner_label: "ase-fixed"
    enabled: true

policy:
  job_ttl_minutes: 30
  max_candidates_per_job: 100
  result_max_age_minutes: 180
  stale_after_minutes: 120
  history_retention_days: 30
  max_nodes: 50000
  processed_result_ids: 2000
