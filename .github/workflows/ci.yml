name: CI Baseline

on:
  push:
    branches: [main, "ase-next/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline regression and public-contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up Go for operator probe agent
        uses: actions/setup-go@v5
        with:
          go-version-file: src/auto_subscription_engine/core/operator_probe/agent/go.mod

      - name: Test operator probe agent
        working-directory: src/auto_subscription_engine/core/operator_probe/agent
        run: go test ./...

      - name: Reject whitespace errors
        run: git show --check --oneline --no-renames HEAD

      - name: Compile package
        run: python -m compileall -q src

      - name: Run offline regression suite
        run: python -m pytest -q

      - name: Validate committed public tree
        run: python -m auto_subscription_engine verify-publish --public-dir public
